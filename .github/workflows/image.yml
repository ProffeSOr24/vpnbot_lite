# Builds the image so servers download it instead of compiling on 1 GB of RAM.
# Image: ghcr.io/<owner>/vpnbot-lite:<branch with / replaced by ->
name: image

on:
  push:
    paths-ignore:
      - "README.md"
      - "ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # a version that does not start is never built — servers keep the previous image
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the bot starts
        run: |
          pip install -q -r requirements.txt pyflakes
          python -m pyflakes app tests
          python tests/startup_test.py

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          image="ghcr.io/${owner}/vpnbot-lite"
          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"
          # every version stays in the registry for ./vpn.sh rollback: :main-1.18.0
          echo "versioned=${image}:${tag}-$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.versioned }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
